<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolution of Finance in the US</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Progress Bar -->
<div id="progress-bar-wrap">
  <div id="progress-bar"></div>
</div>

<div id="app">

  <!-- ══════════════════════════════════════
       START SCREEN
  ══════════════════════════════════════ -->
  <section id="page-start" class="page">
    <div class="start-inner">
      <span class="start-coin">🪙</span>

      <h1 class="start-title">Evolution of Finance<br>in the United States</h1>

      <p class="start-sub">
        From wampum beads to digital wallets — explore how money and payment
        systems transformed across five centuries of American history.
      </p>

      <div class="timeline-dots">
        <div class="t-dot active"></div>
        <div class="t-dot"></div>
        <div class="t-dot"></div>
        <div class="t-dot"></div>
        <div class="t-dot"></div>
      </div>

      <br>

      <button id="btn-start" class="btn btn-primary" style="margin-top:1.5rem;">
        Begin the Timeline →
      </button>
    </div>
  </section>


  <!-- ══════════════════════════════════════
       ERA LIST SCREEN
  ══════════════════════════════════════ -->
  <section id="page-era" class="page">

    <!-- Era progress strip -->
    <div id="era-strip" class="era-progress-strip"></div>

    <!-- Era header -->
    <header class="era-header">
      <button id="era-back-btn" class="era-back">← Home</button>
      <span id="era-label-text" class="era-label"></span>
      <span id="era-step-text" class="era-step"></span>
    </header>

    <!-- Item grid -->
    <div id="era-grid" class="era-items"></div>

    <!-- Bottom nav -->
    <nav class="era-nav">
      <button id="era-prev" class="btn btn-outline">← Previous Era</button>
      <button id="era-next" class="btn btn-primary">Next Era →</button>
    </nav>

  </section>


  <!-- ══════════════════════════════════════
       DETAIL SCREEN
  ══════════════════════════════════════ -->
  <section id="page-detail" class="page">

    <!-- Detail header -->
    <header class="detail-header">
      <button id="detail-back-btn" class="detail-back">← Era</button>
      <span id="detail-era-label" class="detail-era-label"></span>
    </header>

    <!-- Detail body -->
    <div class="detail-body">
      <div id="detail-date-tag" class="detail-date-tag"></div>
      <h2 id="detail-title" class="detail-title"></h2>

      <div class="detail-img-wrap">
        <img id="detail-img" src="" alt="" loading="lazy">
      </div>

      <div id="detail-facts" class="detail-facts"></div>

      <nav class="detail-nav">
        <button id="detail-prev" class="btn btn-outline">← Prev</button>
        <button id="detail-next" class="btn btn-primary">Next →</button>
      </nav>
    </div>

  </section>

</div><!-- #app -->

<script src="script.js"></script>
</body>
</html>
